<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<div class="auth-page"><div class="auth-card">
<h1>Create Account</h1><p class="muted">Start managing your money today.</p>
<form onsubmit="registerUser(event)">
<input type="text" id="regName" placeholder="Full Name" required>
<input type="email" id="regEmail" placeholder="Email" required>
<input type="password" id="regPassword" placeholder="Password" required>
<input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
<button class="primary" type="submit">Register</button>
</form>
<p class="center">Already have an account? <a href="login.html">Login</a></p>
</div></div>
<script src="../js/script.js"></script></body></html>
