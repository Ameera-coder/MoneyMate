<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<div class="auth-page"><div class="auth-card">
<h1>Welcome Back</h1><p class="muted">Login to manage your expenses.</p>
<form onsubmit="login(event)">
<input type="email" id="loginEmail" placeholder="Email" required>
<input type="password" id="loginPassword" placeholder="Password" required>
<button class="primary" type="submit">Login</button>
</form>
<p class="center">Don't have an account? <a href="register.html">Register</a></p>
</div></div>
<script src="../js/script.js"></script></body></html>
