<!DOCTYPE html>
<html lang="en"><head> 
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Add Expense</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline>
    <source src="bg-video.mp4" type="video/mp4">
</video>
    <div id="nav"></div>
<main class="container narrow">
    <div class="page-heading"><div>
        <h1>Add Expense</h1>
        <p class="muted">Record a new expense :) </p>
</div></div>
<section class="panel">
    <form class="form-grid" onsubmit="addExpense(event)">
<label>Amount<input type="number" id="amount" min="1" step="0.01" placeholder="₹ 0.00" required></label>
<label>Category<select id="category" required>
    <option value="">Select category</option>
    <option>Food</option>
    <option>Transport</option>
    <option>Shopping</option>
    <option>Bills</option>
    <option>Education</option>
    <option>Health</option>
    <option>Entertainment</option>
    <option>Other</option>
</select></label>
<label>Date<input type="date" id="date" required></label>
<label>Payment Method<select id="payment" required>
    <option>Cash</option>
    <option>UPI</option>
    <option>Debit Card</option>
    <option>Credit Card</option>
    <option>Bank Transfer</option>
</select></label>
<label class="full">Description  <textarea id="description" placeholder="Add a note..."></textarea> </label>
<button class="primary full" type="submit">Add Expense</button>
</form>
</section>
</main>
<script src="../js/script.js"></script>
</body>
</html>
