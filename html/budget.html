<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Budget</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <video class="background-video" autoplay muted loop playsinline>
            <source src="bg-video.mp4" type="video/mp4">
        </video>
    <div id="nav"></div>
<main class="container narrow">
    <div class="page-heading">
        <div> <h1>Monthly Budget</h1> <p class="muted">Set a spending limit and track your progress.</p> 
        </div> </div>
<section class="panel">
    <form onsubmit="saveBudget(event)">
        <label>Monthly Budget <input type="number" id="budgetInput" min="0" step="0.01" placeholder="₹ 0.00" required> </label> 
        <button class="primary" type="submit">Save Budget</button>
    </form>
<div class="budget-box"><div>
    <span>Spent</span>
    <strong id="spentBudget">₹0</strong>
</div><div><span>Remaining</span>
    <strong id="remainingBudget">₹0</strong>
</div></div>
<div class="progress">
    <div id="progressBar"></div>
</div><p id="budgetText" class="muted"></p>
</section>
</main>
<script src="../js/script.js"></script>
</body>
</html>
